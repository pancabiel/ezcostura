spring:
  web:
    resources:
      static-locations: classpath:/static/

sentry:
  environment: ${SENTRY_ENVIRONMENT:desktop}

ezcostura:
  tenants:
    initial:
      - local
  jwt:
    # Per-installation secret is generated by DesktopMain and passed via system
    # property on first run, then persisted to %APPDATA%\ezcostura\jwt.secret.
    # No fallback default — if missing we fail fast.
    secret: ${JWT_SECRET:}
    access-ttl-seconds: 28800
    refresh-ttl-seconds: 2592000
  cors:
    # Desktop edition is loopback-only; only the bundled UI on 8080 calls the API.
    allowed-origins: http://localhost:8080

logging:
  level:
    com.ezcostura: INFO
    org.flywaydb: INFO
    io.zonky: WARN
