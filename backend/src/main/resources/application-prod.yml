# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
# This profile intentionally has NO defaults for secrets — startup fails
# unless every required env var is supplied.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

sentry:
  environment: ${SENTRY_ENVIRONMENT:production}

ezcostura:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${EZCOSTURA_CORS_ORIGINS}

logging:
  level:
    com.ezcostura: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
